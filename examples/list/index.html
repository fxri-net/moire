<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>moire 列表示例</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font:
          14px/1.6 -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        color: #1f2328;
        background: #f6f8fa;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 18px;
      }
      .moire-table {
        width: 100%;
        border-collapse: collapse;
      }
      .moire-table th,
      .moire-table td {
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid #d0d7de;
      }
      .moire-table tfoot td {
        color: #656d76;
      }
      .moire-list-total {
        margin-right: 12px;
      }
      pre {
        margin: 16px 0 0;
        padding: 12px;
        min-height: 24px;
        overflow: auto;
        background: #f6f8fa;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>列表示例</h1>
      <div id="app"></div>
      <pre id="result"></pre>
    </main>
    <script src="../../dist/moire.min.js"></script>
    <script src="./list.js"></script>
  </body>
</html>
