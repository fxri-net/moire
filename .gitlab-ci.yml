# GitLab CI：完整验收（test）+ 文档站构建部署（pages）
# ⚠️ 需 GitLab runner 已注册；runner 未启用时 job 停留在 pending 属预期
# test 的验收步骤清单唯一真源是 scripts/verify.mjs，此处只调用，不在 CI 里另写一份步骤，避免清单漂移
# 文档站基址与站点/仓库地址按 GitLab Pages 的实际形态推导（/<项目名>/、$CI_PAGES_URL、$CI_PROJECT_URL），
# 平台侧设同名 CI/CD 变量可覆盖；勿写项目完整路径，Pages 只取项目名作子路径
stages:
  - test
  - deploy

test:
  # 与 .node-version 对齐，避免与 GitHub Actions 两侧 node 版本漂移
  image: node:20.20.2
  stage: test
  before_script:
    - corepack enable
  script:
    - pnpm verify
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  image: node:20.20.2
  stage: deploy
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    # 站点参数优先取 CI/CD 变量；未定义时按 GitLab Pages 的默认形态推导，避免把部署位置写死在仓库里
    - export VITEPRESS_BASE="${VITEPRESS_BASE:-/$CI_PROJECT_NAME/}"
    # $CI_PAGES_URL 不带尾斜杠，而 VitePress 的 sitemap/canonical 按 hostname 相对拼接，
    # 缺尾斜杠会吞掉最后一段路径（拼成 /项目名xxx.html），故补齐后再传入
    - export SITE_URL="${SITE_URL:-${CI_PAGES_URL%/}/}"
    - export REPO_URL="${REPO_URL:-$CI_PROJECT_URL}"
    - pnpm docs:build
    - rm -rf public && mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  # 默认分支每次推送都重建：站点输入不止 docs/（config.mts 直接引用源码侧的枚举与版本），
  # 路径过滤必然漏项，故不设 changes 约束
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
